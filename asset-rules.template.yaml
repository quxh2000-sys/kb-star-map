# schema_version 由安装器用来判断规则文件是否还兼容当前版本，请勿删除。
schema_version: 1
# 资产分类规则 —— 请按你自己的目录结构修改本文件
#
# 星图会把每篇笔记判定为一种「资产类型」，不同类型分入不同「星系」。
# 判定顺序（前者优先）：
#   1) frontmatter 的 knowledge_type
#   2) frontmatter 的 dimension（九维分类）
#   3) frontmatter 的 type / category 关键词
#   4) 下面的 path_rules（按目录前缀，自上而下第一个匹配生效）
#   5) fallback（都没匹配上时归入）
#
# ★ 重要：fallback 请保持为【默认可见】的类型（如「未分类」）。
#   若改成「运行记录」，未匹配的笔记会被默认隐藏，首次运行可能看到空图。
fallback: 未分类

# 目录前缀 → 资产类型。可用的类型：
#   来源资料 / 拆解记录 / 知识原子 / 专题知识 / 需求记录 / 方案成果 / 验证反馈 / 治理规则 / 运行记录
# 把下面的示例换成你自己的目录即可；不需要的整行删掉。
path_rules:
  - ["原始资料/", "来源资料"]
  - ["知识原子/", "知识原子"]
  - ["专题/", "专题知识"]
  - ["需求/", "需求记录"]
  - ["方案/", "方案成果"]
  - ["参考资料/", "知识原子"]
